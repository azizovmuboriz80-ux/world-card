<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Map TJ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:sans-serif}
#lang-screen{position:fixed;inset:0;background:#0f172a;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#lang-screen button{margin:10px;padding:15px 30px;width:200px;font-size:18px;border-radius:12px;border:none}
#map{height:100vh;width:100%}
#search{position:fixed;top:10px;left:10px;right:10px;z-index:1000;display:flex;gap:5px}
#search input{flex:1;padding:12px;border-radius:10px;border:2px solid #333}
#search button{padding:12px;border-radius:10px}
#taxiBtn{position:fixed;bottom:20px;right:20px;z-index:1000;padding:15px 25px;background:yellow;border-radius:50px;font-weight:bold}
</style>
</head>
<body>

<div id="lang-screen">
<h2>Забонро интихоб кун / Выберите язык</h2>
<button onclick="setLang('tj')">Тоҷикӣ</button>
<button onclick="setLang('ru')">Русский</button>
<button onclick="setLang('en')">English</button>
</div>

<div id="search">
<input id="q" placeholder="Давлат, шаҳр ҷустуҷӯ... / Поиск...">
<button onclick="search()">🔍</button>
<button onclick="locate()">📍 Ман куҷоям?</button>
</div>

<div id="map"></div>
<button id="taxiBtn" onclick="taxi()">🚕 Такси - Роҳи наздик</button>

<script>
let map, userMarker;
function setLang(l){
 localStorage.setItem('lang', l);
 document.getElementById('lang-screen').style.display='none';
 initMap();
}
function initMap(){
 map = L.map('map').setView([38.5598, 68.7870], 13); // Душанбе
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 // Худкор куҷо ҳастӣ
 locate();
 // Мағозаҳо, бонкҳо ва ғайраро нишон медиҳад (аз OpenStreetMap)
}

function locate(){
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
   let lat=pos.coords.latitude, lon=pos.coords.longitude;
   map.setView([lat, lon], 17);
   if(userMarker) map.removeLayer(userMarker);
   userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Шумо инҷоед! / Вы здесь!").openPopup();
  });
 } else alert("GPS хомӯш аст");
}

function search(){
 let q=document.getElementById('q').value;
 fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`)
 .then(r=>r.json()).then(data=>{
  if(data[0]){
   map.setView([data[0].lat, data[0].lon], 16);
   L.marker([data[0].lat, data[0].lon]).addTo(map).bindPopup(data[0].display_name).openPopup();
  }
 });
}

function taxi(){
 alert("Функсияи такси: 2 нуқта интихоб кун - роҳи бе пробкаро мекашам (OSRM). Инро дар версияи 2 илова мекунем!");
}

// Агар забон қаблан интихоб шуда бошад
if(localStorage.getItem('lang')){
 document.getElementById('lang-screen').style.display='none';
 initMap();
}
</script>
</body>
</html>
