<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Card V5 - Навтарин Спутник</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="manifest" href="./manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%} #map{height:100vh;width:100%}
.controls{position:absolute;top:10px;left:10px;z-index:1000;background:white;padding:6px;border-radius:12px;display:flex;gap:4px;box-shadow:0 2px 8px #0003}
.controls input{padding:9px;width:110px;border-radius:8px;border:1px solid #999}
.controls button{padding:9px;border-radius:8px;border:1px solid #333;background:#fff;font-weight:bold}
#meBtn{background:#4CAF50;color:white;border:none}
#layerSelect{position:absolute;top:65px;right:10px;z-index:1000;background:white;padding:8px;border-radius:12px;border:2px solid black}
#layerSelect select{padding:6px;font-weight:bold}
#taxiBtn{position:absolute;bottom:85px;right:12px;z-index:1000;background:#FFEB3B;padding:12px 18px;border-radius:30px;font-weight:bold;border:2px solid black}
.zoomBox{position:absolute;top:65px;left:10px;z-index:1000;display:flex;flex-direction:column}
.zoomBox button{width:38px;height:38px;font-size:20px;border-radius:8px;border:1px solid #333;background:white}
#info{position:absolute;bottom:10px;left:10px;z-index:1000;background:rgba(0,0,0,0.7);color:white;padding:5px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="map"></div>
<div class="controls">
<input id="search" placeholder="Ҷустуҷӯ">
<button onclick="searchPlace()">🔍</button>
<button id="meBtn" onclick="findMe()">📍 Куҷоям?</button>
</div>
<div id="layerSelect">
<select id="layerType" onchange="changeLayer()">
<option value="osm">🗺️ Харита</option>
<option value="esri">🛰️ Esri (2023-24)</option>
<option value="google" selected>🛰️ Google - Навтарин (2024-25)</option>
<option value="bing">🛰️ Bing (2024)</option>
</select>
</div>
<div class="zoomBox">
<button onclick="map.zoomIn()">+</button>
<button onclick="map.zoomOut()">−</button>
</div>
<button id="taxiBtn" onclick="startTaxi()">🚖 Такси</button>
<div id="info">Спутник Live нест, навтаринаш 6-12 моҳ пеш</div>

<script>
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19});
var esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19});
var google = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:22,maxNativeZoom:20});
var bing = L.tileLayer('https://ecn.t3.tiles.virtualearth.net/tiles/a{q}.jpeg?g=1',{maxZoom:22,maxNativeZoom:19});

var map = L.map('map',{zoomControl:false,layers:[google]}).setView([38.5598,68.7870], 13);
var currentLayer=google;

function changeLayer(){
  var v=document.getElementById('layerType').value;
  map.removeLayer(currentLayer);
  if(v=='osm') currentLayer=osm;
  if(v=='esri') currentLayer=esri;
  if(v=='google') currentLayer=google;
  if(v=='bing') currentLayer=bing;
  map.addLayer(currentLayer);
}

var myMarker=null, routeLine=null, routeLineBg=null, taxiMarkers=[], taxiPoints=[];

function findMe(){
  navigator.geolocation.getCurrentPosition(function(p){
    if(myMarker) map.removeLayer(myMarker);
    var acc = Math.round(p.coords.accuracy);
    myMarker=L.marker([p.coords.latitude,p.coords.longitude]).addTo(map)
    .bindPopup("Ту ҳамин ҷоӣ!<br>Дақиқӣ: " + acc + " метр<br>" + (acc>50?"Дар кушодӣ баромада санҷ!":"Дақиқ аст!")).openPopup();
    map.setView([p.coords.latitude,p.coords.longitude], 17);
  },function(e){alert("GPS-ро фаъол кун ва Allow пахш кун!");},{enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

async function searchPlace(){
  let q=document.getElementById('search').value; if(!q) return;
  let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
  let data=await res.json(); if(data[0]){ map.setView([data[0].lat,data[0].lon], 18); L.marker([data[0].lat,data[0].lon]).addTo(map); }
}

function startTaxi(){
  taxiPoints=[]; 
  taxiMarkers.forEach(m=>map.removeLayer(m)); taxiMarkers=[];
  if(routeLine) map.removeLayer(routeLine);
  if(routeLineBg) map.removeLayer(routeLineBg);
  alert("2 ҷой пахш кун: 1-Аз куҷо, 2-Ба куҷо");
  map.on('click', addTaxiPoint);
}

async function addTaxiPoint(e){
  taxiPoints.push(e.latlng); 
  var m=L.marker(e.latlng).addTo(map).bindPopup(taxiPoints.length==1?"Аз инҷо":"Ба инҷо").openPopup(); 
  taxiMarkers.push(m);
  if(taxiPoints.length==2){
    map.off('click', addTaxiPoint);
    try{
      let url=`https://router.project-osrm.org/route/v1/driving/${taxiPoints[0].lng},${taxiPoints[0].lat};${taxiPoints[1].lng},${taxiPoints[1].lat}?overview=full&geometries=geojson`;
      let res=await fetch(url); let data=await res.json();
      if(data.routes && data.routes[0]){
        // Ду хат - یکی сафед барои дида шудан дар спутник
        routeLineBg=L.geoJSON(data.routes[0].geometry,{style:{color:'white',weight:10,opacity:0.9}}).addTo(map);
        routeLine=L.geoJSON(data.routes[0].geometry,{style:{color:'#0066FF',weight:6}}).addTo(map);
        let dist=(data.routes[0].distance/1000).toFixed(2); 
        let dur=Math.round(data.routes[0].duration/60);
        alert(`Роҳи наздик: ${dist} км, Вақт: ${dur} дақ`);
        map.fitBounds(routeLine.getBounds(),{padding:[50,50]});
      } else {
        alert("Роҳ ёфт нашуд, дубора пахш кун");
      }
    }catch(err){ 
      alert("Интернет суст аст, дубора санҷ");
    }
    taxiPoints=[];
  }
}
</script>
</body>
</html>
