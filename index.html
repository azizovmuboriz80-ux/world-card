<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Card - Душанбе</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
#map{height:100vh;width:100%}
body{margin:0}
.top{position:absolute;top:10px;left:10px;z-index:1000;display:flex;gap:5px}
.top input{padding:8px;width:200px;border-radius:8px;border:2px solid #333}
.top button{padding:8px 12px;border-radius:8px;background:white;border:2px solid #333}
#taxiBtn{position:absolute;bottom:80px;right:20px;z-index:1000;background:yellow;padding:12px 18px;border-radius:20px;font-weight:bold;border:2px solid black}
.zoom{position:absolute;top:10px;left:5px;z-index:1000;display:flex;flex-direction:column}
.zoom button{width:30px;height:30px;font-size:18px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
<input id="search" placeholder="ҷустуҷу">
<button onclick="searchPlace()">🔍</button>
<button onclick="findMe()">📍 Ман куҷоям?</button>
</div>
<div class="zoom">
<button onclick="map.zoomIn()">+</button>
<button onclick="map.zoomOut()">-</button>
</div>
<button id="taxiBtn" onclick="taxiMode()">🚖 Такси - Роҳи наздик</button>

<script>
var map = L.map('map').setView([38.5598, 68.7870], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
var myMarker=null, routeLine=null;
var taxiPoints=[];

function findMe(){
 if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(function(p){
   var lat=p.coords.latitude, lon=p.coords.longitude;
   if(myMarker) map.removeLayer(myMarker);
   myMarker=L.marker([lat,lon]).addTo(map).bindPopup("Ту ҳамин ҷоӣ!").openPopup();
   map.setView([lat,lon], 18); // АНА ИН НАЗДИК МЕКУНАД - ЗУМ 18!
  });
 }
}

async function searchPlace(){
 let q=document.getElementById('search').value;
 if(!q) return;
 let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
 let data=await res.json();
 if(data[0]){
  map.setView([data[0].lat, data[0].lon], 18);
  L.marker([data[0].lat, data[0].lon]).addTo(map);
 }
}

function taxiMode(){
 alert("Акнун 2 ҷойро дар харита пахш кун - роҳи наздикро мекашам!");
 taxiPoints=[];
 map.on('click', addTaxiPoint);
}

async function addTaxiPoint(e){
 taxiPoints.push(e.latlng);
 L.marker(e.latlng).addTo(map).bindPopup("Нуқта "+taxiPoints.length).openPopup();
 if(taxiPoints.length==2){
  map.off('click', addTaxiPoint);
  // OSRM - роҳи наздикро мегирад
  let url=`https://router.project-osrm.org/route/v1/driving/${taxiPoints[0].lng},${taxiPoints[0].lat};${taxiPoints[1].lng},${taxiPoints[1].lat}?overview=full&geometries=geojson`;
  let res=await fetch(url);
  let data=await res.json();
  if(data.routes && data.routes[0]){
   if(routeLine) map.removeLayer(routeLine);
   routeLine=L.geoJSON(data.routes[0].geometry,{style:{color:'blue',weight:5}}).addTo(map);
   let dist=(data.routes[0].distance/1000).toFixed(1);
   alert(`Роҳи наздик: ${dist} км`);
  }
  taxiPoints=[];
 }
}

findMe();
</script>
</body>
</html>
