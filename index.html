<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Card V4 - Спутник</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;padding:0;height:100%}
#map{height:100vh;width:100%}
.controls{position:absolute;top:10px;left:10px;z-index:1000;background:white;padding:8px;border-radius:12px;display:flex;gap:5px;box-shadow:0 2px 8px #0003}
.controls input{padding:10px;width:130px;border-radius:8px;border:1px solid #999}
.controls button{padding:10px;border-radius:8px;border:1px solid #333;background:#fff;font-weight:bold}
#meBtn{background:#4CAF50;color:white;border:none}
#layerBtn{position:absolute;top:70px;right:15px;z-index:1000;background:white;padding:10px 14px;border-radius:20px;font-weight:bold;border:2px solid black}
#taxiBtn{position:absolute;bottom:90px;right:15px;z-index:1000;background:#FFEB3B;padding:14px 20px;border-radius:30px;font-weight:bold;border:2px solid black}
.zoomBox{position:absolute;top:70px;left:12px;z-index:1000;display:flex;flex-direction:column}
.zoomBox button{width:40px;height:40px;font-size:22px;border-radius:8px;border:1px solid #333;background:white}
</style>
</head>
<body>
<div id="map"></div>
<div class="controls">
<input id="search" placeholder="Ҷустуҷӯ">
<button onclick="searchPlace()">🔍</button>
<button id="meBtn" onclick="findMe()">📍 Куҷоям?</button>
</div>
<button id="layerBtn" onclick="toggleLayer()">🛰️ Спутник</button>
<div class="zoomBox">
<button onclick="map.zoomIn()">+</button>
<button onclick="map.zoomOut()">−</button>
</div>
<button id="taxiBtn" onclick="startTaxi()">🚖 Такси</button>

<script>
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22,maxNativeZoom:19});
var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:22,maxNativeZoom:19, attribution:'Esri'});

var map = L.map('map',{zoomControl:false,layers:[osm]}).setView([38.5598,68.7870], 13);
var isSatellite=false;

function toggleLayer(){
  if(isSatellite){
    map.removeLayer(satellite); map.addLayer(osm);
    document.getElementById('layerBtn').innerText='🛰️ Спутник';
    isSatellite=false;
  } else {
    map.removeLayer(osm); map.addLayer(satellite);
    document.getElementById('layerBtn').innerText='🗺️ Харита';
    isSatellite=true;
  }
}

var myMarker=null, routeLine=null, taxiMarkers=[], taxiPoints=[], taxiActive=false;

function findMe(){
  navigator.geolocation.getCurrentPosition(function(p){
    var lat=p.coords.latitude, lon=p.coords.longitude;
    if(myMarker) map.removeLayer(myMarker);
    myMarker=L.marker([lat,lon]).addTo(map).bindPopup("Ту ҳамин ҷоӣ!").openPopup();
    // Агар хоҳӣ хонаат дида шавад, автоматӣ ба спутник мегузарад
    if(!isSatellite) toggleLayer();
    map.setView([lat,lon], 20);
  }, function(e){alert("GPS фаъол кун: "+e.message);},{enableHighAccuracy:true});
}

async function searchPlace(){
  let q=document.getElementById('search').value;
  if(!q) return;
  let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
  let data=await res.json();
  if(data[0]){ map.setView([data[0].lat,data[0].lon], 19); L.marker([data[0].lat,data[0].lon]).addTo(map); }
}

function startTaxi(){
  taxiActive=true; taxiPoints=[]; taxiMarkers.forEach(m=>map.removeLayer(m)); taxiMarkers=[]; if(routeLine) map.removeLayer(routeLine);
  alert("2 ҷой пахш кун: Аз куҷо - То куҷо");
  map.on('click', addTaxiPoint);
}
async function addTaxiPoint(e){
  taxiPoints.push(e.latlng);
  var m=L.marker(e.latlng).addTo(map).bindPopup(taxiPoints.length==1?"Аз":"То").openPopup();
  taxiMarkers.push(m);
  if(taxiPoints.length==2){
    map.off('click', addTaxiPoint); taxiActive=false;
    try{
      let url=`https://router.project-osrm.org/route/v1/driving/${taxiPoints[0].lng},${taxiPoints[0].lat};${taxiPoints[1].lng},${taxiPoints[1].lat}?overview=full&geometries=geojson`;
      let res=await fetch(url); let data=await res.json();
      if(data.routes && data.routes[0]){
        routeLine=L.geoJSON(data.routes[0].geometry,{style:{color:'yellow',weight:6}}).addTo(map);
        let dist=(data.routes[0].distance/1000).toFixed(2);
        alert(`Роҳ: ${dist} км`);
        map.fitBounds(routeLine.getBounds(),{padding:[40,40]});
      }
    }catch{ routeLine=L.polyline(taxiPoints,{color:'yellow',weight:6}).addTo(map); }
    taxiPoints=[];
  }
}
</script>
</body>
</html>
